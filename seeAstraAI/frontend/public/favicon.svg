<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Orbit Astra app icon</title>
  <desc id="desc">A clean geometric A with a cyan-to-violet orbital swoosh and a white star on a deep navy rounded-square background.</desc>
  <defs>
    <linearGradient id="aGradient" x1="155" y1="100" x2="355" y2="405" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#31DDF0"/>
      <stop offset=".48" stop-color="#347CFF"/>
      <stop offset="1" stop-color="#A64DFF"/>
    </linearGradient>
    <linearGradient id="orbitGradient" x1="58" y1="330" x2="455" y2="255" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B64CFF"/>
      <stop offset=".48" stop-color="#557BFF"/>
      <stop offset="1" stop-color="#27E0F0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#07123F"/>

  <!-- Geometric letter A -->
  <path d="M119 386 207 150Q221 113 256 113t49 37l68 160-58 22-59-129-61 145-76 38Z"
        fill="url(#aGradient)"/>
  <path d="M107 405h54q11 0 18-10l27-39-79 10-20 27q-8 12 0 12Z"
        fill="#5C6DFF"/>
  <path d="M313 309 370 405h42q12 0 6-12l-57-104Z"
        fill="#8060FF"/>

  <!-- Orbit crosses in front of the letter -->
  <path d="M61 330C126 376 280 324 389 264c34-19 57-42 52-58-4-14-27-19-49-17 37-13 72-1 76 23 7 35-45 69-85 90-112 60-277 105-342 71-32-17-15-47 20-76Z"
        fill="url(#orbitGradient)"/>

  <!-- Four-point star -->
  <path d="M394 91c5 43 19 57 62 62-43 5-57 19-62 62-5-43-19-57-62-62 43-5 57-19 62-62Z"
        fill="#FFFFFF"/>
</svg>
